[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: 실제 외부 API(LlamaParse/OpenAI)를 호출하는 테스트. 기본 실행에서 제외",
]
addopts = "-m 'not integration'"
